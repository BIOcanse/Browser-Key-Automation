<!doctype html>
<html><head><meta charset="utf-8"><title>Browser Key Automation</title></head><body>
<script>
// This manifest sandbox has a unique origin and no extension APIs. One HTML
// submission replaces this document; another demo.open navigates a fresh page.
window.addEventListener("message", function render(event) {
  if (event.source !== parent || !event.data || event.data.kind !== "demo.render" || typeof event.data.html !== "string") return;
  window.removeEventListener("message", render);
  document.open();
  document.write(event.data.html);
  document.close();
  parent.postMessage({ kind: "demo.rendered", title: document.title }, "*");
});
</script>
</body></html>
